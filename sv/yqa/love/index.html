<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For YQA ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #2a0e1e 0%, #160810 55%, #0d0409 100%);
    font-family: "Consolas", "Courier New", monospace;
    overflow: hidden;
  }

  /* 背景漂浮爱心 */
  .float-heart {
    position: fixed;
    bottom: -40px;
    color: rgba(255, 105, 150, 0.18);
    animation: floatUp linear infinite;
    pointer-events: none;
    user-select: none;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  /* 终端窗口 */
  .terminal {
    width: min(720px, 92vw);
    background: rgba(20, 8, 14, 0.92);
    border: 1px solid rgba(255, 105, 150, 0.25);
    border-radius: 14px;
    box-shadow:
      0 0 60px rgba(255, 77, 126, 0.25),
      0 25px 60px rgba(0, 0, 0, 0.6);
    overflow: hidden;
    position: relative;
    z-index: 2;
  }

  /* 标题栏 */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.04);
    border-bottom: 1px solid rgba(255, 105, 150, 0.15);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .titlebar span {
    margin-left: 10px;
    font-size: 13px;
    color: rgba(255, 182, 203, 0.6);
    letter-spacing: 1px;
  }

  /* 内容区 */
  .screen {
    padding: 28px 34px 34px;
    min-height: 480px;
  }

  .heart-line {
    white-space: pre;
    text-align: center;
    font-size: 15px;
    line-height: 1.35;
    letter-spacing: 1px;
    min-height: 20px;
  }
  .heart-line .ch {
    display: inline-block;
    text-shadow: 0 0 8px currentColor;
    animation: pop 0.18s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .name-line {
    text-align: center;
    margin-top: 22px;
    font-size: 46px;
    font-weight: bold;
    letter-spacing: 12px;
    min-height: 60px;
  }
  .name-line .ch {
    display: inline-block;
    background: linear-gradient(135deg, #ffd1dc 0%, #ff4d7e 45%, #ffb347 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 77, 126, 0.7));
    animation: pop 0.25s ease-out;
  }

  .msg-line {
    text-align: center;
    margin-top: 26px;
    font-size: 24px;
    min-height: 36px;
    color: #ffc2d4;
    text-shadow: 0 0 14px rgba(255, 105, 150, 0.6);
    letter-spacing: 2px;
  }

  /* 光标 */
  .cursor {
    display: inline-block;
    width: 12px;
    height: 1.15em;
    margin-left: 4px;
    vertical-align: text-bottom;
    background: #ff6b9d;
    box-shadow: 0 0 10px rgba(255, 107, 157, 0.9);
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* 结尾跳动的小爱心 */
  .beat {
    display: inline-block;
    animation: heartbeat 1.1s ease-in-out infinite;
    color: #ff4d7e;
    text-shadow: 0 0 16px rgba(255, 77, 126, 0.9);
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(1.3); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1.35); }
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="titlebar">
    <div class="dot r"></div>
    <div class="dot y"></div>
    <div class="dot g"></div>
    <span>love — for YQA</span>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
  /* ========== 内容定义 ========== */
  const HEART = [
    "   *******       *******   ",
    " ***********   *********** ",
    "****************************",
    "****************************",
    "****************************",
    " ************************** ",
    "  ************************ ",
    "   **********************  ",
    "    ********************   ",
    "     ******************    ",
    "       **************      ",
    "         **********        ",
    "           ******          ",
    "            ****           ",
    "             **            ",
  ];
  const NAME = "YQA";
  const MESSAGE = "易奇奥宝宝，我会一直爱你的。";

  const screenEl = document.getElementById("screen");
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  /* 爱心配色：粉红渐变，带光晕 */
  function heartColor(row, col) {
    const lightness = 62 + Math.sin((row + col) * 0.35) * 8;
    const hue = 335 + Math.sin(col * 0.3) * 12;
    return `hsl(${hue}, 95%, ${lightness}%)`;
  }

  /* 逐字符打出一行 */
  async function typeLine(container, text, colorFn, speed) {
    const line = document.createElement("div");
    line.className = container;
    screenEl.appendChild(line);
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === " ") {
        line.appendChild(document.createTextNode(" "));
      } else {
        const span = document.createElement("span");
        span.className = "ch";
        span.textContent = ch;
        if (colorFn) span.style.color = colorFn(i);
        line.appendChild(span);
      }
      await sleep(speed);
    }
    return line;
  }

  /* 背景漂浮爱心 */
  function spawnFloatingHearts() {
    for (let i = 0; i < 16; i++) {
      const h = document.createElement("div");
      h.className = "float-heart";
      h.textContent = "❤";
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = 14 + Math.random() * 22 + "px";
      h.style.animationDuration = 8 + Math.random() * 10 + "s";
      h.style.animationDelay = Math.random() * 8 + "s";
      document.body.appendChild(h);
    }
  }

  async function main() {
    spawnFloatingHearts();
    await sleep(400);

    /* 1. 逐行打出爱心 */
    for (let r = 0; r < HEART.length; r++) {
      const line = document.createElement("div");
      line.className = "heart-line";
      screenEl.appendChild(line);
      for (let c = 0; c < HEART[r].length; c++) {
        const ch = HEART[r][c];
        if (ch === " ") {
          line.appendChild(document.createTextNode(" "));
        } else {
          const span = document.createElement("span");
          span.className = "ch";
          span.textContent = ch;
          span.style.color = heartColor(r, c);
          line.appendChild(span);
          await sleep(10);
        }
      }
      await sleep(60);
    }

    await sleep(500);

    /* 2. 打出 YQA */
    await typeLine("name-line", NAME, null, 260);
    await sleep(500);

    /* 3. 打出情话 + 光标 + 跳动爱心 */
    const msgLine = document.createElement("div");
    msgLine.className = "msg-line";
    screenEl.appendChild(msgLine);
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    msgLine.appendChild(cursor);

    for (const ch of MESSAGE) {
      cursor.insertAdjacentText("beforebegin", ch);
      await sleep(160);
    }
    await sleep(300);
    const beat = document.createElement("span");
    beat.className = "beat";
    beat.textContent = " ❤";
    msgLine.insertBefore(beat, cursor);
  }

  main();
</script>
</body>
</html>
